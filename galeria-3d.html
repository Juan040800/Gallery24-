<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gallery24 · Sala 3D PBR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#6E1F3E;
    --wine-deep:#4E1530;
    --paper:#FBFAF7;
    --ink:#211D19;
    --glass: rgba(251,250,247,0.12);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#0a0908; font-family:'Inter',system-ui,sans-serif; touch-action:none; }
  canvas{ display:block; width:100%; height:100%; }

  /* ---------- Liquid Glass UI ---------- */
  #topbar{
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 22px; pointer-events:none;
  }
  #topbar a, #roomLabel{
    pointer-events:auto;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    background: linear-gradient(135deg, rgba(251,250,247,0.18), rgba(251,250,247,0.06));
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.25);
    color: var(--paper);
    border-radius: 999px;
    text-decoration:none;
  }
  #topbar a{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em;
    padding:11px 20px;
  }
  #roomLabel{
    font-family:'Fraunces', serif; font-style:italic;
    padding:11px 22px; font-size:0.95rem;
  }

  #crosshair{
    position:fixed; top:50%; left:50%; width:5px; height:5px;
    transform:translate(-50%,-50%); border-radius:50%;
    background:rgba(255,255,255,0.9); z-index:15; display:none;
    box-shadow:0 0 8px rgba(255,255,255,0.6);
  }

  #startOverlay{
    position:fixed; inset:0; z-index:30;
    background: linear-gradient(165deg, #2A0C1B 0%, #1a0a12 50%, #0d0609 100%);
    color:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
  }
  #startOverlay::before{
    content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 30%, rgba(110,31,62,0.35), transparent 60%);
    pointer-events:none;
  }
  #startOverlay h1{
    font-family:'Fraunces', serif; font-size:clamp(1.8rem,5vw,2.4rem);
    font-style:italic; max-width:16ch; position:relative;
  }
  #startOverlay p{
    margin-top:18px; max-width:36ch; opacity:0.85;
    font-size:0.95rem; line-height:1.65; position:relative;
  }
  #startBtn{
    margin-top:36px; font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem; text-transform:uppercase; letter-spacing:0.12em;
    background:var(--paper); color:var(--wine-deep);
    border:none; padding:17px 38px; border-radius:999px; cursor:pointer;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    position:relative;
  }
  #startBtn:hover{ transform:translateY(-2px); box-shadow:0 16px 48px rgba(0,0,0,0.4); }
  #controlsHint{
    margin-top:22px; font-family:'IBM Plex Mono', monospace;
    font-size:0.65rem; opacity:0.55; letter-spacing:0.05em; position:relative;
  }

  #artInfo{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    z-index:20; max-width:min(90vw,420px);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    background: linear-gradient(160deg, rgba(251,250,247,0.92), rgba(251,250,247,0.78));
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: 0 16px 48px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
    color:var(--ink); padding:16px 28px; border-radius:24px;
    text-align:center; display:none;
  }
  #artInfo .t{ font-family:'Fraunces', serif; font-style:italic; font-size:1.05rem; }
  #artInfo .m{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem;
    text-transform:uppercase; letter-spacing:0.07em; color:var(--wine); margin-top:5px;
  }

  /* Joystick móvil */
  #mobileControls{ display:none; position:fixed; inset:0; z-index:18; pointer-events:none; }
  #joystickZone{
    position:absolute; bottom:40px; left:30px;
    width:130px; height:130px; border-radius:50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    pointer-events:auto;
  }
  #joystickKnob{
    position:absolute; width:54px; height:54px; border-radius:50%;
    background: rgba(251,250,247,0.85);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    top:50%; left:50%; transform:translate(-50%,-50%);
    transition: none;
  }
  #lookHint{
    position:absolute; bottom:50px; right:30px;
    font-family:'IBM Plex Mono', monospace; font-size:0.6rem;
    color:rgba(255,255,255,0.45); letter-spacing:0.06em;
    text-transform:uppercase; pointer-events:none;
  }
</style>
</head>
<body>

<div id="startOverlay">
  <span style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;color:#C7A44F;position:relative;">Gallery24 · PBR Experience</span>
  <h1 style="margin-top:16px;">Camina por el museo</h1>
  <p>Iluminación física, cristal líquido y materiales reales. Usa WASD + mouse en escritorio. En móvil: joystick + arrastra para mirar.</p>
  <button id="startBtn">Entrar a la sala →</button>
  <span id="controlsHint">ESC para liberar el mouse · Toca fuera del joystick para mirar</span>
</div>

<div id="topbar">
  <a href="inicio.html">← Salir</a>
  <span id="roomLabel">Sala 1</span>
  <span style="width:70px;"></span>
</div>

<div id="crosshair"></div>
<div id="artInfo">
  <div class="t" id="artTitle"></div>
  <div class="m" id="artMeta"></div>
</div>

<div id="mobileControls">
  <div id="joystickZone"><div id="joystickKnob"></div></div>
  <div id="lookHint">Arrastra para mirar</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// -------------------------------------------------
// 1. RENDERER + PBR PIPELINE
// -------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Environment map (clave para PBR real)
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
const envMap = pmrem.fromScene(envScene, 0.04).texture;
pmrem.dispose();

// -------------------------------------------------
// 2. ESCENA
// -------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2efe8);
scene.environment = envMap;
scene.fog = new THREE.Fog(0xf2efe8, 22, 55);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.08, 80);
camera.position.set(5.5, 1.65, 5.2);

// -------------------------------------------------
// 3. ILUMINACIÓN FÍSICA
// -------------------------------------------------
const hemi = new THREE.HemisphereLight(0xfff5e6, 0xd4cfc4, 0.55);
scene.add(hemi);

// Skylight principal
const sun = new THREE.DirectionalLight(0xfff8f0, 1.6);
sun.position.set(8, 18, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0003;
scene.add(sun);

// Luces de acento por sala (cálidas)
[6, 18, 30].forEach((x) => {
  const spot = new THREE.SpotLight(0xfff2d8, 18, 16, Math.PI / 5, 0.4, 1.4);
  spot.position.set(x, 3.85, 5);
  spot.target.position.set(x, 0, 5);
  spot.castShadow = true;
  spot.shadow.mapSize.set(1024, 1024);
  scene.add(spot);
  scene.add(spot.target);
});

// -------------------------------------------------
// 4. MATERIALES PBR
// -------------------------------------------------
const wallMat = new THREE.MeshStandardMaterial({
  color: 0xf5f1e9,
  roughness: 0.88,
  metalness: 0.02,
  envMapIntensity: 0.6
});

const floorLightMat = new THREE.MeshStandardMaterial({
  color: 0xe8e3d6,
  roughness: 0.55,
  metalness: 0.05,
  envMapIntensity: 0.7
});

const floorDarkMat = new THREE.MeshPhysicalMaterial({
  color: 0x1a1917,
  roughness: 0.18,
  metalness: 0.35,
  clearcoat: 0.9,
  clearcoatRoughness: 0.12,
  envMapIntensity: 1.2
});

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.05,
  transmission: 0.92,
  thickness: 0.35,
  ior: 1.5,
  envMapIntensity: 1.4,
  transparent: true,
  side: THREE.DoubleSide
});

const woodMat = new THREE.MeshStandardMaterial({
  color: 0x4a3428,
  roughness: 0.65,
  metalness: 0.08
});

const pedestalMat = new THREE.MeshStandardMaterial({
  color: 0xf8f5ee,
  roughness: 0.4,
  metalness: 0.05
});

// -------------------------------------------------
// 5. ARQUITECTURA
// -------------------------------------------------
const TOTAL_LENGTH = 38;
const ROOM_DEPTH = 11;
const wallBoxes = [];

function addBox(x, y, z, w, h, d, mat, cast = true, receive = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  scene.add(mesh);
  if (mat !== glassMat) {
    wallBoxes.push(new THREE.Box3().setFromObject(mesh));
  }
  return mesh;
}

// Piso principal (claro)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(TOTAL_LENGTH, ROOM_DEPTH), floorLightMat);
floor.rotation.x = -Math.PI / 2;
floor.position.set(TOTAL_LENGTH / 2, 0, ROOM_DEPTH / 2);
floor.receiveShadow = true;
scene.add(floor);

// Zona de mármol negro (sala central)
const darkFloor = new THREE.Mesh(new THREE.PlaneGeometry(11.5, ROOM_DEPTH - 0.4), floorDarkMat);
darkFloor.rotation.x = -Math.PI / 2;
darkFloor.position.set(18, 0.01, ROOM_DEPTH / 2);
darkFloor.receiveShadow = true;
scene.add(darkFloor);

// Techo
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(TOTAL_LENGTH, ROOM_DEPTH), wallMat);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.set(TOTAL_LENGTH / 2, 4.1, ROOM_DEPTH / 2);
scene.add(ceiling);

// Skylight (emisor)
const skyGeo = new THREE.PlaneGeometry(14, 6);
const skyMat = new THREE.MeshBasicMaterial({ color: 0xfffaf2 });
const skylight = new THREE.Mesh(skyGeo, skyMat);
skylight.rotation.x = Math.PI / 2;
skylight.position.set(7, 4.08, 5.5);
scene.add(skylight);

// Paredes exteriores
addBox(TOTAL_LENGTH / 2, 2.05, 0.12, TOTAL_LENGTH, 4.1, 0.24, wallMat);
addBox(TOTAL_LENGTH / 2, 2.05, ROOM_DEPTH - 0.12, TOTAL_LENGTH, 4.1, 0.24, wallMat);
addBox(0.12, 2.05, ROOM_DEPTH / 2, 0.24, 4.1, ROOM_DEPTH, wallMat);
addBox(TOTAL_LENGTH - 0.12, 2.05, ROOM_DEPTH / 2, 0.24, 4.1, ROOM_DEPTH, wallMat);

// Divisiones con hueco + cristal
function addGlassPartition(x) {
  // Tramos de muro
  addBox(x, 2.05, 1.7, 0.22, 4.1, 3.2, wallMat);
  addBox(x, 2.05, ROOM_DEPTH - 1.7, 0.22, 4.1, 3.2, wallMat);
  // Cristal central (liquid glass) — se ve transparente, pero SÍ bloquea el paso
  const glass = new THREE.Mesh(new THREE.BoxGeometry(0.08, 3.6, 3.8), glassMat);
  glass.position.set(x, 2.0, ROOM_DEPTH / 2);
  scene.add(glass);
  wallBoxes.push(new THREE.Box3().setFromObject(glass));
}
addGlassPartition(12.2);
addGlassPartition(24.2);

// Muro de madera (referencia visual)
addBox(11.5, 2.05, 0.4, 0.35, 4.1, 0.7, woodMat);

// -------------------------------------------------
// 6. OBRAS + ESCULTURAS
// -------------------------------------------------
const textureLoader = new THREE.TextureLoader();
const artworks = [
  { x: 4.2, z: 0.28, ry: 0, url: 'https://picsum.photos/seed/g1/600/750', title: 'Cartagena Eterna', meta: 'Camila Restrepo · Óleo' },
  { x: 8.8, z: 0.28, ry: 0, url: 'https://picsum.photos/seed/g2/600/750', title: 'Lo que Permanece', meta: 'Julián Ortega · Fotografía' },
  { x: 6.5, z: 10.72, ry: Math.PI, url: 'https://picsum.photos/seed/g3/600/750', title: 'Raíces', meta: 'Mariana Duque · Técnica mixta' },
  { x: 16.5, z: 0.28, ry: 0, url: 'https://picsum.photos/seed/g4/600/750', title: 'Mural Urbano', meta: 'Esteban Ríos · Arte urbano' },
  { x: 20.8, z: 0.28, ry: 0, url: 'https://picsum.photos/seed/g5/600/750', title: 'Costa Adentro', meta: 'Camila Restrepo · Pintura' },
  { x: 18.5, z: 10.72, ry: Math.PI, url: 'https://picsum.photos/seed/g6/600/750', title: 'Retrato Silente', meta: 'Daniela Cano · Fotografía' },
  { x: 28.2, z: 0.28, ry: 0, url: 'https://picsum.photos/seed/g7/600/750', title: 'Territorio', meta: 'Andrés Pardo · Arte digital' },
  { x: 33.5, z: 0.28, ry: 0, url: 'https://picsum.photos/seed/g8/600/750', title: 'Memoria Viva', meta: 'Julián Ortega · Video-arte' },
];

const artHitboxes = [];

artworks.forEach((art) => {
  // Marco
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.95, 2.55, 0.09), new THREE.MeshStandardMaterial({
    color: 0x2c241e, roughness: 0.45, metalness: 0.15
  }));
  frame.position.set(art.x, 1.95, art.z);
  frame.rotation.y = art.ry;
  frame.castShadow = true;
  scene.add(frame);

  // Lienzo
  const tex = textureLoader.load(art.url);
  tex.colorSpace = THREE.SRGBColorSpace;
  const canvas = new THREE.Mesh(
    new THREE.PlaneGeometry(1.65, 2.2),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0 })
  );
  const off = art.ry === 0 ? 0.055 : -0.055;
  canvas.position.set(art.x + Math.sin(art.ry) * off, 1.95, art.z + Math.cos(art.ry) * off);
  canvas.rotation.y = art.ry;
  scene.add(canvas);

  artHitboxes.push({ x: art.x, z: art.z, title: art.title, meta: art.meta });
});

// Esculturas abstractas sobre pedestales
function addSculpture(x, z, color = 0xc9b8a4) {
  const ped = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.7), pedestalMat);
  ped.position.set(x, 0.45, z);
  ped.castShadow = true;
  ped.receiveShadow = true;
  scene.add(ped);

  const sculp = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.32, 0),
    new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.1 })
  );
  sculp.position.set(x, 1.25, z);
  sculp.castShadow = true;
  scene.add(sculp);
}
addSculpture(2.8, 3.2, 0xb8a48f);
addSculpture(9.5, 7.8, 0xd4c4b0);
addSculpture(15.2, 4.5, 0xa89078);
addSculpture(26.5, 8.1, 0xc9b8a4);

// Banco
const bench = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.42, 0.55), woodMat);
bench.position.set(18, 0.21, 7.8);
bench.castShadow = true;
scene.add(bench);

// -------------------------------------------------
// 7. ETIQUETAS DE SALA
// -------------------------------------------------
function makeLabel(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(78,21,48,0.82)';
  ctx.beginPath();
  ctx.roundRect(0, 0, 512, 128, 28);
  ctx.fill();
  ctx.fillStyle = '#FBFAF7';
  ctx.font = 'italic 48px Georgia';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);
  const tex = new THREE.CanvasTexture(c);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sprite.scale.set(2.6, 0.65, 1);
  return sprite;
}
const roomNames = ['Cartagena Eterna', 'Arte Urbano', 'Territorios Digitales'];
[6.5, 18.5, 30.5].forEach((x, i) => {
  const s = makeLabel(roomNames[i]);
  s.position.set(x, 3.45, ROOM_DEPTH / 2);
  scene.add(s);
});

// -------------------------------------------------
// 8. CONTROLES (Desktop + Mobile)
// -------------------------------------------------
const controls = new PointerLockControls(camera, document.body);
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 900;

const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const crosshair = document.getElementById('crosshair');
const roomLabelEl = document.getElementById('roomLabel');
const artInfoEl = document.getElementById('artInfo');
const artTitleEl = document.getElementById('artTitle');
const artMetaEl = document.getElementById('artMeta');
const mobileControls = document.getElementById('mobileControls');

startBtn.addEventListener('click', () => {
  if (isMobile) {
    startOverlay.style.display = 'none';
    mobileControls.style.display = 'block';
  } else {
    controls.lock();
  }
});

controls.addEventListener('lock', () => {
  startOverlay.style.display = 'none';
  crosshair.style.display = 'block';
});
controls.addEventListener('unlock', () => {
  startOverlay.style.display = 'flex';
  crosshair.style.display = 'none';
});

// Movimiento teclado
const move = { f: false, b: false, l: false, r: false };
document.addEventListener('keydown', e => {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') move.f = true;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') move.b = true;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') move.l = true;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') move.r = true;
});
document.addEventListener('keyup', e => {
  if (e.code === 'KeyW' || e.code === 'ArrowUp') move.f = false;
  if (e.code === 'KeyS' || e.code === 'ArrowDown') move.b = false;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') move.l = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') move.r = false;
});

// Joystick móvil
const zone = document.getElementById('joystickZone');
const knob = document.getElementById('joystickKnob');
let joy = { active: false, x: 0, y: 0 };
const maxRadius = 38;

function updateKnob(dx, dy) {
  const len = Math.hypot(dx, dy);
  const k = len > maxRadius ? maxRadius / len : 1;
  joy.x = (dx * k) / maxRadius;
  joy.y = (dy * k) / maxRadius;
  knob.style.transform = `translate(calc(-50% + ${dx * k}px), calc(-50% + ${dy * k}px))`;
}

zone.addEventListener('touchstart', e => {
  e.preventDefault();
  joy.active = true;
  const t = e.touches[0];
  const r = zone.getBoundingClientRect();
  updateKnob(t.clientX - r.left - r.width / 2, t.clientY - r.top - r.height / 2);
}, { passive: false });

zone.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joy.active) return;
  const t = e.touches[0];
  const r = zone.getBoundingClientRect();
  updateKnob(t.clientX - r.left - r.width / 2, t.clientY - r.top - r.height / 2);
}, { passive: false });

zone.addEventListener('touchend', () => {
  joy.active = false;
  joy.x = 0; joy.y = 0;
  knob.style.transform = 'translate(-50%, -50%)';
});

// Mirar con el dedo (móvil)
let lookTouch = null;
let lastLookX = 0, lastLookY = 0;
const euler = new THREE.Euler(0, 0, 0, 'YXZ');

renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches.length === 1 && !joy.active) {
    lookTouch = e.touches[0].identifier;
    lastLookX = e.touches[0].clientX;
    lastLookY = e.touches[0].clientY;
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
  for (const t of e.touches) {
    if (t.identifier === lookTouch) {
      const dx = t.clientX - lastLookX;
      const dy = t.clientY - lastLookY;
      lastLookX = t.clientX;
      lastLookY = t.clientY;
      euler.setFromQuaternion(camera.quaternion);
      euler.y -= dx * 0.004;
      euler.x -= dy * 0.004;
      euler.x = Math.max(-1.4, Math.min(1.4, euler.x));
      camera.quaternion.setFromEuler(euler);
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouch) lookTouch = null;
  }
});

// -------------------------------------------------
// 9. FÍSICA SIMPLE + UI
// -------------------------------------------------
const PLAYER_R = 0.38;
const SPEED = 3.8;
const clock = new THREE.Clock();

function tryMove(dx, dz) {
  const pos = camera.position;
  const nextX = pos.x + dx;
  const nextZ = pos.z + dz;

  const boxX = new THREE.Box3(
    new THREE.Vector3(nextX - PLAYER_R, 0.1, pos.z - PLAYER_R),
    new THREE.Vector3(nextX + PLAYER_R, 1.9, pos.z + PLAYER_R)
  );
  if (!wallBoxes.some(b => b.intersectsBox(boxX))) pos.x = nextX;

  const boxZ = new THREE.Box3(
    new THREE.Vector3(pos.x - PLAYER_R, 0.1, nextZ - PLAYER_R),
    new THREE.Vector3(pos.x + PLAYER_R, 1.9, nextZ + PLAYER_R)
  );
  if (!wallBoxes.some(b => b.intersectsBox(boxZ))) pos.z = nextZ;
}

function updateUI() {
  const x = camera.position.x;
  const idx = x < 12.2 ? 0 : x < 24.2 ? 1 : 2;
  roomLabelEl.textContent = `Sala ${idx + 1} — ${roomNames[idx]}`;

  let nearest = null, dist = 2.7;
  artHitboxes.forEach(a => {
    const d = Math.hypot(camera.position.x - a.x, camera.position.z - a.z);
    if (d < dist) { dist = d; nearest = a; }
  });
  if (nearest) {
    artTitleEl.textContent = nearest.title;
    artMetaEl.textContent = nearest.meta;
    artInfoEl.style.display = 'block';
  } else {
    artInfoEl.style.display = 'none';
  }
}

// -------------------------------------------------
// 10. LOOP
// -------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const speed = SPEED * dt;

  let dx = 0, dz = 0;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();
  const right = new THREE.Vector3(-dir.z, 0, dir.x);

  if (isMobile) {
    // Joystick
    dx += dir.x * -joy.y * speed + right.x * joy.x * speed;
    dz += dir.z * -joy.y * speed + right.z * joy.x * speed;
  } else if (controls.isLocked) {
    if (move.f) { dx += dir.x * speed; dz += dir.z * speed; }
    if (move.b) { dx -= dir.x * speed; dz -= dir.z * speed; }
    if (move.r) { dx += right.x * speed; dz += right.z * speed; }
    if (move.l) { dx -= right.x * speed; dz -= right.z * speed; }
  }

  if (dx !== 0 || dz !== 0) tryMove(dx, dz);
  updateUI();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
